services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: subterra
      POSTGRES_PASSWORD: subterra
      POSTGRES_DB: subterra_data
    ports:
      # 5433 on the host -- Subterra Core's own Postgres already uses 5432
      - "5433:5432"
    volumes:
      - subterra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subterra -d subterra_data"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://subterra:subterra@db:5432/subterra_data
      # Password-reset email. Passed through from the host environment or the
      # root .env (which is git-ignored); no secrets are written here. Left
      # empty, the API selects the development console mailer and no mail is
      # sent anywhere. See .env.example and docs/authentication.md.
      SUBTERRA_ENV: ${SUBTERRA_ENV:-development}
      SUBTERRA_APP_URL: ${SUBTERRA_APP_URL:-http://localhost:3000}
      SUBTERRA_EMAIL_PROVIDER: ${SUBTERRA_EMAIL_PROVIDER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SUBTERRA_EMAIL_FROM: ${SUBTERRA_EMAIL_FROM:-}
      SUBTERRA_EMAIL_REPLY_TO: ${SUBTERRA_EMAIL_REPLY_TO:-}
    ports:
      # 8001 on the host -- Subterra Core's own API already uses 8000
      - "8001:8000"
    volumes:
      - ./datasets:/app/datasets
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  subterra_pgdata:
