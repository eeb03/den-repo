services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: subterra
      POSTGRES_PASSWORD: subterra
      POSTGRES_DB: subterra_data
    ports:
      # 5433 on the host -- Subterra Core's own Postgres already uses 5432
      - "5433:5432"
    volumes:
      - subterra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subterra -d subterra_data"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://subterra:subterra@db:5432/subterra_data
      # Password-reset email. Passed through from the host environment or the
      # root .env (which is git-ignored); no secrets are written here. Left
      # empty, the API selects the development console mailer and no mail is
      # sent anywhere. See .env.example and docs/authentication.md.
      SUBTERRA_ENV: ${SUBTERRA_ENV:-development}
      SUBTERRA_APP_URL: ${SUBTERRA_APP_URL:-http://localhost:3000}
      SUBTERRA_EMAIL_PROVIDER: ${SUBTERRA_EMAIL_PROVIDER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SUBTERRA_EMAIL_FROM: ${SUBTERRA_EMAIL_FROM:-}
      SUBTERRA_EMAIL_REPLY_TO: ${SUBTERRA_EMAIL_REPLY_TO:-}
      # Dataset integrity signing (security.dataset_integrity). Empty means
      # signing is unavailable, not a per-restart random key -- see that
      # module's own docstring for why. Generate one with
      # security.dataset_integrity.generate_signing_key() and set it in the
      # root .env (git-ignored).
      INTEGRITY_SIGNING_PRIVATE_KEY: ${INTEGRITY_SIGNING_PRIVATE_KEY:-}
    ports:
      # 8001 on the host -- Subterra Core's own API already uses 8000
      - "8001:8000"
    volumes:
      - ./datasets:/app/datasets
      - ./logs:/app/logs
      # The benchmark endpoint serves these and the benchmark page renders
      # them, but they are gitignored and regenerable so the image does not
      # carry them -- without this mount both are permanently empty in a
      # compose environment. Read-only: the API only ever reads artifacts, and
      # scoring runs write them from the host.
      - ./artifacts:/app/artifacts:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  subterra_pgdata:
