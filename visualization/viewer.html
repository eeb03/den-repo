<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Subterra Data Platform — 3D Viewer</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #0b0f14; color: #e6e6e6; }
  #controls { padding: 14px 18px; background: #11161d; border-bottom: 1px solid #232b35; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  #controls label { font-size: 13px; color: #9aa7b5; }
  #controls input[type=text] { width: 420px; padding: 6px 8px; background: #1a212a; border: 1px solid #2c3742; color: #e6e6e6; border-radius: 4px; }
  #controls button { padding: 6px 14px; background: #2f6feb; border: none; color: white; border-radius: 4px; cursor: pointer; }
  #controls button:hover { background: #4285f4; }
  #status { font-size: 13px; color: #9aa7b5; }
  #plot { width: 100vw; height: calc(100vh - 64px); }
  .slider-group { display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 180px; }
</style>
</head>
<body>

<div id="controls">
  <label>Dataset IDs (comma-separated):
    <input type="text" id="datasetIds" placeholder="d3dca710-...,e3e432e3-..." />
  </label>
  <button onclick="loadDatasets()">Load</button>
  <div class="slider-group" id="depthSliderGroup" style="display:none;">
    <label>Depth range:</label>
    <input type="range" id="depthMin" step="0.01" oninput="applyDepthFilter()" />
    <input type="range" id="depthMax" step="0.01" oninput="applyDepthFilter()" />
    <span id="depthLabel"></span>
  </div>
  <div class="slider-group">
    <label>View:</label>
    <select id="viewMode" onchange="onViewModeChange()">
      <option value="points">Point cloud</option>
      <option value="heatmap">Heatmap (top-down)</option>
      <option value="surface">Surface (elevation-draped)</option>
      <option value="bscan">B-scan (trace × depth)</option>
    </select>
  </div>
  <div class="slider-group" id="focusGroup" style="display:none;">
    <label>Focus:</label>
    <select id="focusSelect" onchange="onFocusChange()"></select>
  </div>
  <div class="slider-group" id="bscanLineGroup" style="display:none;">
    <label>Line (source file):</label>
    <select id="bscanLineSelect" onchange="onBscanLineChange()"></select>
  </div>
  <div class="slider-group">
    <label>Highlight |signal| ≥</label>
    <input type="number" id="anomalyThreshold" value="0" min="0" step="0.5" style="width:60px;" oninput="onAnomalyThresholdChange()" />
    <span style="font-size:12px;color:#6b7684;">(0 = show all points; try 2-3 for z-scored/anomaly data)</span>
  </div>
  <span id="status"></span>
</div>

<div id="plot"></div>

<script>
const API_BASE = window.location.origin + "/api";
let allTraces = {};   // dataset_id -> {points, sensor_type}
let depthBounds = { min: 0, max: 1 };
let refLat = 0, refLon = 0;
let focusRange = null;  // {x:[lo,hi], y:[lo,hi], z:[lo,hi]} or null for auto
let lastDepthLo, lastDepthHi;
let anomalyThreshold = 0;
let viewMode = "points";
let bscanSourceFile = null;  // explicitly chosen SEG-Y line for B-scan mode; null = not yet chosen

async function fetchDatasetPoints(datasetId) {
  const resp = await fetch(`${API_BASE}/datasets/${datasetId}/points?max_points=15000`);
  if (!resp.ok) {
    const body = await resp.json().catch(() => ({}));
    throw new Error(`Dataset ${datasetId}: ${body.detail || resp.statusText}`);
  }
  return resp.json();
}

// Whether "candidate analysis does not apply" for this dataset -- the same
// signal frontend/components/candidates/candidate-intelligence.tsx (slices
// 10-16) already reads from this exact endpoint. Used ONLY to decide whether
// the empty-scene status may still say "the B-scan view still works", which
// is a GPR-trace claim: for an off-GPR composition a B-scan does not apply
// either (slices 5-6, 15-16). Any failure to determine this -- a network
// error, an unexpected shape -- resolves to false, so the historical GPR
// sentence is the fail-closed default, same as the React panes.
async function fetchDatasetDoesNotApply(datasetId) {
  try {
    const resp = await fetch(`${API_BASE}/candidates/${datasetId}`);
    if (!resp.ok) return false;
    const body = await resp.json();
    return body.status === "blocked"
      && typeof body.status_reason === "string"
      && body.status_reason.includes("does not apply");
  } catch (e) {
    return false;
  }
}

// Only records that actually carry a geographic position may be placed on
// the map.
//
// `/points` returns lat/lon 0.0 for a record whose position is absent, and
// says so per point via `position_kind`. That is a deliberate contract, not
// a bug: tests/test_frame_read_path.py pins it as "(0,0) in lat/lon must be
// identifiable as 'no position', not a location". This page previously
// ignored the field and plotted the placeholder, which put every
// unpositioned record at null island and labelled it as a measurement.
//
// Excluded records are counted rather than silently dropped -- an empty
// plot and a plot with a third of its data missing must not look alike.
//
// Scope: this affects only the views that PLACE a point on Earth (the point
// cloud, and the bounding boxes derived from it). The B-scan is indexed by
// trace and depth, carries no coordinate, and is untouched. The heatmap and
// surface go through /grid, which already refuses a dataset with no
// geographic position.
function geographicPoints(data) {
  return data.points.filter(pt => pt.position_kind === "geographic");
}

function zValue(pt) {
  // Prefer true absolute elevation (surface elevation - depth) when DEM-aligned.
  if (pt.absolute_elevation_m !== null && pt.absolute_elevation_m !== undefined) {
    return pt.absolute_elevation_m;
  }
  if (pt.depth !== null && pt.depth !== undefined) {
    return -pt.depth;
  }
  if (pt.elevation !== null && pt.elevation !== undefined) {
    return pt.elevation;
  }
  // Last resort: for single-band raster sources (DEM tiles), the pixel
  // value IS the elevation, but it lands in `signal` rather than
  // `elevation` since the GeoTIFF converter doesn't know a given raster
  // represents elevation vs. some other quantity. Without this fallback,
  // DEM points would all render at z=0 while GPR points sit at their real
  // 400-700m elevation -- an invisible plot, not an empty one.
  if (pt.signal !== null && pt.signal !== undefined) {
    return pt.signal;
  }
  return 0;
}

// Equirectangular approximation: converts lat/lon to local meters relative
// to a reference point. Needed because raw lon/lat (tiny values, ~0.0001
// degree spans) and elevation (hundreds of meters) are wildly different
// units -- plotting them together with aspectmode="data" (true-to-scale
// proportions) collapses the whole scene into an invisible sliver.
function toLocalMeters(lat, lon, lat0, lon0) {
  const dx = (lon - lon0) * 111320 * Math.cos(lat0 * Math.PI / 180);
  const dy = (lat - lat0) * 110540;
  return [dx, dy];
}

async function loadDatasets() {
  const idsRaw = document.getElementById("datasetIds").value.trim();
  if (!idsRaw) { setStatus("Enter at least one dataset ID."); return; }
  const ids = idsRaw.split(",").map(s => s.trim()).filter(Boolean);

  setStatus(`Loading ${ids.length} dataset(s)...`);
  allTraces = {};
  bscanSourceFile = null;  // new datasets loaded -- forget any previously chosen B-scan line
  document.getElementById("bscanLineGroup").style.display = "none";
  let minDepth = Infinity, maxDepth = -Infinity;

  for (const id of ids) {
    try {
      const data = await fetchDatasetPoints(id);
      // Split once, here, so every placing view reads the same filtered set.
      data.geoPoints = geographicPoints(data);
      data.excludedNoPosition = data.points.length - data.geoPoints.length;
      // Fetched once per load, cached on the entry -- render() stays
      // synchronous and does not refetch on every depth/anomaly/focus
      // re-render.
      data.candidateAnalysisDoesNotApply = await fetchDatasetDoesNotApply(id);
      allTraces[id] = data;
      for (const pt of data.points) {
        if (pt.depth !== null && pt.depth !== undefined) {
          minDepth = Math.min(minDepth, pt.depth);
          maxDepth = Math.max(maxDepth, pt.depth);
        }
      }
    } catch (e) {
      setStatus(`Error: ${e.message}`);
      return;
    }
  }

  if (isFinite(minDepth) && isFinite(maxDepth) && minDepth < maxDepth) {
    depthBounds = { min: minDepth, max: maxDepth };
    const depthMinEl = document.getElementById("depthMin");
    const depthMaxEl = document.getElementById("depthMax");
    depthMinEl.min = minDepth; depthMinEl.max = maxDepth; depthMinEl.value = minDepth;
    depthMaxEl.min = minDepth; depthMaxEl.max = maxDepth; depthMaxEl.value = maxDepth;
    document.getElementById("depthSliderGroup").style.display = "flex";
  } else {
    document.getElementById("depthSliderGroup").style.display = "none";
  }

  // Reference point for local-meters conversion: mean lat/lon across every
  // POSITIONED point, so all datasets share one consistent local coordinate
  // frame. Averaging the 0.0 placeholders in would drag the origin toward
  // null island and shift every real point away from where it was measured.
  let sumLat = 0, sumLon = 0, n = 0;
  for (const data of Object.values(allTraces)) {
    for (const pt of data.geoPoints) { sumLat += pt.lat; sumLon += pt.lon; n++; }
  }
  refLat = n ? sumLat / n : 0;
  refLon = n ? sumLon / n : 0;

  populateFocusSelect();
  render();

  const plotted = Object.values(allTraces).reduce((t, d) => t + d.geoPoints.length, 0);
  const excluded = Object.values(allTraces).reduce((t, d) => t + d.excludedNoPosition, 0);
  const excludedNote = excluded
    ? ` ${excluded} record(s) carry no geographic position and are NOT plotted `
      + `(the API reports lat/lon 0.0 for these; they are not located at 0,0).`
    : "";
  setStatus(
    `Loaded ${ids.length} dataset(s), ${plotted} positioned point(s) shown.${excludedNote}`
  );
}

function applyDepthFilter() {
  const lo = parseFloat(document.getElementById("depthMin").value);
  const hi = parseFloat(document.getElementById("depthMax").value);
  document.getElementById("depthLabel").textContent = `${lo.toFixed(2)}m – ${hi.toFixed(2)}m`;
  lastDepthLo = lo; lastDepthHi = hi;
  render(lo, hi);
}

function computeBBox(points) {
  const xs = points.map(pt => toLocalMeters(pt.lat, pt.lon, refLat, refLon)[0]);
  const ys = points.map(pt => toLocalMeters(pt.lat, pt.lon, refLat, refLon)[1]);
  const zs = points.map(zValue);
  return {
    xmin: Math.min(...xs), xmax: Math.max(...xs),
    ymin: Math.min(...ys), ymax: Math.max(...ys),
    zmin: Math.min(...zs), zmax: Math.max(...zs),
  };
}

function padRange(v0, v1, frac = 0.15, minPad = 1.0) {
  const m = Math.max((v1 - v0) * frac, minPad);
  return [v0 - m, v1 + m];
}

function percentile(arr, p) {
  if (arr.length === 0) return 0;
  const sorted = [...arr].sort((a, b) => a - b);
  const idx = Math.min(sorted.length - 1, Math.max(0, Math.floor((p / 100) * sorted.length)));
  return sorted[idx];
}

function populateFocusSelect() {
  const select = document.getElementById("focusSelect");
  select.innerHTML = "";

  const allOpt = document.createElement("option");
  allOpt.value = "__all__";
  allOpt.textContent = "All (full extent)";
  select.appendChild(allOpt);

  // Counts here are POSITIONED points, because focusing is a geographic
  // operation: a dataset with a million unpositioned records contributes
  // nothing to any extent, and labelling it as the largest would send the
  // default focus to a dataset that cannot be shown at all.
  let densestId = null, densestCount = -1;
  for (const [id, data] of Object.entries(allTraces)) {
    const opt = document.createElement("option");
    opt.value = id;
    const n = data.geoPoints.length;
    opt.textContent = n === data.returned_points
      ? `${data.name} (${n} pts)`
      : `${data.name} (${n} of ${data.returned_points} pts positioned)`;
    select.appendChild(opt);
    if (n > densestCount) { densestCount = n; densestId = id; }
  }

  // Default focus to whichever loaded dataset has the most positioned points
  // -- for a survey + a deliberately-padded DEM tile, that's almost always
  // the survey itself, which is the thing you actually want filling the view.
  select.value = densestId || "__all__";
  document.getElementById("focusGroup").style.display = Object.keys(allTraces).length ? "flex" : "none";
  setFocusFromSelection();
}

function onFocusChange() {
  setFocusFromSelection();
  bscanSourceFile = null;  // focused dataset changed -- its available source files differ
  render(lastDepthLo, lastDepthHi);
}

function setFocusFromSelection() {
  const sel = document.getElementById("focusSelect").value;
  let points;
  if (sel === "__all__") {
    points = Object.values(allTraces).flatMap(d => d.geoPoints);
  } else {
    points = allTraces[sel] ? allTraces[sel].geoPoints : [];
  }
  // A bounding box over unpositioned records would be a box around (0,0).
  if (points.length === 0) { focusRange = null; return; }

  const bbox = computeBBox(points);
  focusRange = {
    x: padRange(bbox.xmin, bbox.xmax),
    y: padRange(bbox.ymin, bbox.ymax),
    z: padRange(bbox.zmin, bbox.zmax),
  };
}

function onAnomalyThresholdChange() {
  const val = parseFloat(document.getElementById("anomalyThreshold").value);
  anomalyThreshold = isFinite(val) ? val : 0;
  render(lastDepthLo, lastDepthHi);
}

async function fetchDatasetGrid(datasetId, field, depth) {
  let url = `${API_BASE}/datasets/${datasetId}/grid?field=${field}&smooth=true&smoothing_window=3`;
  if (depth !== undefined && depth !== null) url += `&depth=${depth}`;
  const resp = await fetch(url);
  if (!resp.ok) {
    const body = await resp.json().catch(() => ({}));
    throw new Error(`Dataset ${datasetId} grid: ${body.detail || resp.statusText}`);
  }
  return resp.json();
}

function onViewModeChange() {
  viewMode = document.getElementById("viewMode").value;
  render(lastDepthLo, lastDepthHi);
}

async function renderHeatmap() {
  // Heatmap uses whichever dataset is currently focused (the classic
  // top-down "depth slice" view -- looking straight down at one layer).
  const sel = document.getElementById("focusSelect").value;
  const datasetId = sel === "__all__" ? Object.keys(allTraces)[0] : sel;
  if (!datasetId) { setStatus("No dataset to render."); return; }

  try {
    const gridData = await fetchDatasetGrid(datasetId, "signal");
    const lonMeters = gridData.lon_centers.map(lon => toLocalMeters(gridData.lat_centers[0], lon, refLat, refLon)[0]);
    const latMeters = gridData.lat_centers.map(lat => toLocalMeters(lat, gridData.lon_centers[0], refLat, refLon)[1]);

    Plotly.newPlot("plot", [{
      type: "heatmap",
      x: lonMeters,
      y: latMeters,
      z: gridData.grid,
      colorscale: "Viridis",
      colorbar: { thickness: 14 },
      hoverongaps: false,
    }], {
      paper_bgcolor: "#0b0f14",
      plot_bgcolor: "#0b0f14",
      font: { color: "#e6e6e6" },
      xaxis: { title: "Easting (m, local)", color: "#9aa7b5" },
      yaxis: { title: "Northing (m, local)", color: "#9aa7b5", scaleanchor: "x" },
      margin: { l: 60, r: 20, t: 20, b: 50 },
      title: { text: `${gridData.name} — depth ${gridData.depth}m`, font: { color: "#e6e6e6", size: 13 } },
    }, { responsive: true });
  } catch (e) {
    setStatus(`Error: ${e.message}`);
  }
}

async function fetchDatasetTraceGrid(datasetId, field, sourceFile) {
  let url = `${API_BASE}/datasets/${datasetId}/trace_grid?field=${field}`;
  if (sourceFile) url += `&source_file=${encodeURIComponent(sourceFile)}`;
  const resp = await fetch(url);
  if (!resp.ok) {
    const body = await resp.json().catch(() => ({}));
    throw new Error(`Dataset ${datasetId} trace_grid: ${body.detail || resp.statusText}`);
  }
  return resp.json();
}

function populateBscanLineSelect(availableSourceFiles, selected) {
  const group = document.getElementById("bscanLineGroup");
  const select = document.getElementById("bscanLineSelect");
  if (!availableSourceFiles || availableSourceFiles.length <= 1) {
    group.style.display = "none";
    return;
  }
  group.style.display = "flex";
  select.innerHTML = "";
  for (const sf of availableSourceFiles) {
    const opt = document.createElement("option");
    opt.value = sf;
    opt.textContent = sf;
    select.appendChild(opt);
  }
  select.value = selected;
}

function onBscanLineChange() {
  bscanSourceFile = document.getElementById("bscanLineSelect").value;
  renderBscan();
}

async function renderBscan() {
  // The radargram/B-scan view: x = position along the survey line (trace
  // index), y = real physical depth, color = signal/anomaly intensity.
  // This is what a single survey line actually looks like -- unlike the
  // lat/lon heatmap, which degenerates for a near-1D line.
  const sel = document.getElementById("focusSelect").value;
  const datasetId = sel === "__all__" ? Object.keys(allTraces)[0] : sel;
  if (!datasetId) { setStatus("No dataset to render."); return; }

  try {
    // Explicit selection, never a silent pick among multiple lines: the
    // first fetch (no source_file chosen yet) uses the API's own default
    // ONLY to discover what's available; if there's more than one line,
    // the dropdown is shown and the user's choice drives every render after.
    const gridData = await fetchDatasetTraceGrid(datasetId, "signal", bscanSourceFile);
    populateBscanLineSelect(gridData.available_source_files, gridData.source_file);
    bscanSourceFile = gridData.source_file;

    Plotly.newPlot("plot", [{
      type: "heatmap",
      x: gridData.trace_indices,
      y: gridData.depths,
      z: gridData.grid,
      colorscale: "Viridis",
      colorbar: { thickness: 14, title: "signal" },
      hoverongaps: false,
    }], {
      paper_bgcolor: "#0b0f14",
      plot_bgcolor: "#0b0f14",
      font: { color: "#e6e6e6" },
      xaxis: { title: "Trace index (position along survey line)", color: "#9aa7b5" },
      yaxis: { title: "Depth (m)", color: "#9aa7b5", autorange: "reversed" },
      margin: { l: 60, r: 20, t: 30, b: 50 },
      title: { text: `${gridData.name} — ${gridData.source_file} (${gridData.n_traces} traces × ${gridData.n_depths} depths)`, font: { color: "#e6e6e6", size: 13 } },
    }, { responsive: true });

    const velocityNote = gridData.velocity_m_per_ns != null
      ? ` | depth assumes ${gridData.velocity_m_per_ns} m/ns (default, not site-calibrated)`
      : "";
    setStatus(`B-scan: ${gridData.n_traces} traces × ${gridData.n_depths} depth samples, source_file=${gridData.source_file}.${velocityNote}`);
  } catch (e) {
    setStatus(`Error: ${e.message}`);
  }
}

async function renderSurface() {
  // Surface drapes the signal grid (color) over the elevation grid (shape)
  // for the focused dataset -- an actual 3D "terrain with data painted on
  // it" rather than a scattered point cloud.
  const sel = document.getElementById("focusSelect").value;
  const datasetId = sel === "__all__" ? Object.keys(allTraces)[0] : sel;
  if (!datasetId) { setStatus("No dataset to render."); return; }

  try {
    const signalGrid = await fetchDatasetGrid(datasetId, "signal");
    let elevGrid;
    try {
      elevGrid = await fetchDatasetGrid(datasetId, "absolute_elevation_m", signalGrid.depth);
    } catch (e) {
      elevGrid = null; // dataset isn't DEM-aligned -- fall back to a flat surface
    }

    const lonMeters = signalGrid.lon_centers.map(lon => toLocalMeters(signalGrid.lat_centers[0], lon, refLat, refLon)[0]);
    const latMeters = signalGrid.lat_centers.map(lat => toLocalMeters(lat, signalGrid.lon_centers[0], refLat, refLon)[1]);

    let zGrid;
    if (elevGrid && elevGrid.grid.length === signalGrid.grid.length && elevGrid.grid[0].length === signalGrid.grid[0].length) {
      zGrid = elevGrid.grid.map(row => row.map(v => v ?? 0));
      setStatus(`Surface: elevation-draped (DEM-aligned), depth ${signalGrid.depth}m.`);
    } else {
      zGrid = signalGrid.grid.map(row => row.map(() => 0));
      setStatus(`Surface: flat (no DEM alignment for this dataset), depth ${signalGrid.depth}m.`);
    }

    Plotly.newPlot("plot", [{
      type: "surface",
      x: lonMeters,
      y: latMeters,
      z: zGrid,
      surfacecolor: signalGrid.grid,
      colorscale: "Viridis",
      colorbar: { thickness: 14 },
    }], {
      paper_bgcolor: "#0b0f14",
      plot_bgcolor: "#0b0f14",
      font: { color: "#e6e6e6" },
      scene: {
        xaxis: { title: "Easting (m, local)", color: "#9aa7b5" },
        yaxis: { title: "Northing (m, local)", color: "#9aa7b5" },
        zaxis: { title: "Elevation (m)", color: "#9aa7b5" },
        aspectmode: "data",
        dragmode: "orbit",
      },
      margin: { l: 0, r: 0, t: 36, b: 0 },
    }, { responsive: true });
  } catch (e) {
    setStatus(`Error: ${e.message}`);
  }
}

function render(depthLo, depthHi) {
  if (viewMode === "heatmap") { renderHeatmap(); return; }
  if (viewMode === "surface") { renderSurface(); return; }
  if (viewMode === "bscan") { renderBscan(); return; }

  const traces = [];
  for (const [id, data] of Object.entries(allTraces)) {
    // Positioned records only -- see geographicPoints().
    let points = data.geoPoints;
    if (depthLo !== undefined && depthHi !== undefined) {
      points = points.filter(pt => pt.depth === null || pt.depth === undefined || (pt.depth >= depthLo && pt.depth <= depthHi));
    }
    if (anomalyThreshold > 0) {
      points = points.filter(pt => pt.signal !== null && pt.signal !== undefined && Math.abs(pt.signal) >= anomalyThreshold);
    }
    if (points.length === 0) continue;

    const signalVals = points.map(pt => pt.signal ?? 0);
    // Contrast enhancement: clip the colorscale to the 2nd-98th percentile
    // instead of full min/max, so a couple of extreme outliers don't wash
    // out the color contrast for everything else.
    const cmin = percentile(signalVals, 2);
    const cmax = percentile(signalVals, 98);

    traces.push({
      type: "scatter3d",
      mode: "markers",
      name: `${data.name} (${data.sensor_type})`,
      x: points.map(pt => toLocalMeters(pt.lat, pt.lon, refLat, refLon)[0]),
      y: points.map(pt => toLocalMeters(pt.lat, pt.lon, refLat, refLon)[1]),
      z: points.map(zValue),
      text: points.map(pt =>
        `lat: ${pt.lat.toFixed(6)}, lon: ${pt.lon.toFixed(6)}<br>sensor: ${pt.sensor_type}<br>signal: ${pt.signal !== null ? pt.signal.toFixed(3) : "n/a"}<br>depth: ${pt.depth ?? "n/a"}m<br>ground_truth: ${pt.ground_truth}` +
        (pt.trace_index !== null && pt.trace_index !== undefined ? `<br>trace: ${pt.trace_index}` : "") +
        (pt.anomaly_reliable === false ? `<br>⚠ low-confidence (edge of survey)` : "")
      ),
      hoverinfo: "text",
      marker: {
        size: 2.5,
        color: signalVals,
        colorscale: "Viridis",
        cmin: cmin,
        cmax: cmax,
        showscale: traces.length === 0,
        colorbar: { len: 0.85, y: 0.42, thickness: 14 },
        opacity: 0.8,
      },
    });
  }

  // "Nothing positioned to plot" and "nothing loaded" are different states.
  // Say which one this is, rather than leaving an empty scene to be read as
  // either -- or, worse, as a rendering failure.
  if (traces.length === 0 && Object.keys(allTraces).length > 0) {
    const excluded = Object.values(allTraces)
      .reduce((t, d) => t + d.excludedNoPosition, 0);
    // The B-scan clause is a GPR-trace claim (slices 5-6, 15-16): only kept
    // when at least one loaded dataset is NOT the off-GPR blocked reason
    // (GPR, empty composition, mixed, or the candidates fetch failed/was
    // inconclusive -- fail closed toward the historical sentence).
    const allDoesNotApply = Object.values(allTraces)
      .every(d => d.candidateAnalysisDoesNotApply);
    Plotly.purge("plot");
    setStatus(
      excluded
        ? `Nothing to plot: all ${excluded} loaded record(s) carry no geographic `
          + `position, so none can be placed. They remain available through the API`
          + (allDoesNotApply
              ? `.`
              : `, and the B-scan view still works because it is indexed by trace, not by coordinate.`)
        : "Nothing to plot: no point survived the current depth/anomaly filters."
    );
    return;
  }

  const scene = {
    xaxis: { title: "Easting (m, local)", color: "#9aa7b5" },
    yaxis: { title: "Northing (m, local)", color: "#9aa7b5" },
    zaxis: { title: "Elevation (m)", color: "#9aa7b5" },
    aspectmode: "data",
    dragmode: "orbit",
  };
  if (focusRange) {
    scene.xaxis.range = focusRange.x;
    scene.yaxis.range = focusRange.y;
    scene.zaxis.range = focusRange.z;
  }

  Plotly.newPlot("plot", traces, {
    paper_bgcolor: "#0b0f14",
    plot_bgcolor: "#0b0f14",
    font: { color: "#e6e6e6" },
    scene: scene,
    // t:36 leaves room for the modebar (zoom/pan/orbit icons) at the top-right;
    // without it the legend renders directly on top of those buttons and
    // swallows clicks meant for them.
    margin: { l: 0, r: 0, t: 36, b: 0 },
    legend: { x: 0, y: 0, xanchor: "left", yanchor: "bottom", bgcolor: "rgba(11,15,20,0.7)" },
  }, { responsive: true, displayModeBar: true });
}

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

// Auto-load from ?datasets=id1,id2 in the URL if present
window.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  const datasets = params.get("datasets");
  if (datasets) {
    document.getElementById("datasetIds").value = datasets;
    loadDatasets();
  }
});
</script>
